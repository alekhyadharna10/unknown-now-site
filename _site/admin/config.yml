backend:
  name: git-gateway
  branch: main

# Files saved through this editor commit straight to GitHub,
# and Netlify rebuilds the site automatically.
media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "site-settings"
        label: "Site Settings (Logo)"
        file: "src/_data/site.json"
        fields:
          - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Upload to replace the text logo in the header. Leave empty to keep the text version." }
          - { label: "Logo Alt Text", name: "logoAlt", widget: "string" }

      - name: "home"
        label: "Home Page"
        file: "src/index.njk"
        format: "frontmatter"
        fields:
          - { label: "Browser Tab Title", name: "title", widget: "string" }
          - { label: "Search Description", name: "description", widget: "text" }
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "Pull Quote", name: "quote", widget: "text" }
          - label: "Three Pillars"
            name: "pillars"
            widget: "list"
            label_singular: "Pillar"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }
              - { label: "Link Text", name: "linkText", widget: "string" }
          - { label: "Cohort Section Title", name: "cohortTitle", widget: "string" }
          - { label: "Cohort Section Text", name: "cohortBody", widget: "text" }
          - label: "Cohort Roles"
            name: "cohortRoles"
            widget: "list"
            label_singular: "Role"
            summary: "{{fields.name}}"
            fields:
              - { label: "Role Name", name: "name", widget: "string" }
              - { label: "What They Do", name: "body", widget: "text" }

      - name: "about"
        label: "About Page"
        file: "src/about.njk"
        format: "frontmatter"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string", required: false }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "Mission Label", name: "missionKicker", widget: "string", required: false }
          - { label: "Mission Heading", name: "missionHeading", widget: "string" }
          - { label: "Mission Paragraph 1", name: "missionBody", widget: "text" }
          - { label: "Mission Paragraph 2", name: "missionBody2", widget: "text" }
          - { label: "Story Label", name: "storyKicker", widget: "string", required: false }
          - { label: "Story Heading", name: "storyHeading", widget: "string", required: false }
          - { label: "Story Text", name: "storyBody", widget: "text", required: false }
          - { label: "Founders Label", name: "foundersKicker", widget: "string", required: false }
          - { label: "Founders Heading", name: "foundersHeading", widget: "string", required: false }
          - label: "Founders"
            name: "founders"
            widget: "list"
            label_singular: "Founder"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Photo", name: "photo", widget: "image", required: false }
              - { label: "Bio", name: "bio", widget: "text" }

      - name: "cohort"
        label: "Cohort: Interns & Mentors"
        file: "src/_data/cohort.json"
        fields:
          - { label: "Page Eyebrow", name: "heroEyebrow", widget: "string", required: false }
          - { label: "Page Title", name: "heroTitle", widget: "string", required: false }
          - { label: "Page Subtext", name: "heroLede", widget: "text", required: false }
          - { label: "Program Label", name: "programKicker", widget: "string", required: false }
          - { label: "Program Heading", name: "programHeading", widget: "string", required: false }
          - label: "Program Points"
            name: "programPoints"
            widget: "list"
            label_singular: "Point"
            summary: "{{fields.title}}"
            required: false
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "body", widget: "text" }
          - { label: "Interns Label", name: "internsKicker", widget: "string", required: false }
          - { label: "Interns Heading", name: "internsHeading", widget: "string", required: false }
          - { label: "Interns Intro", name: "internsIntro", widget: "text", required: false }
          - label: "Interns"
            name: "interns"
            widget: "list"
            label_singular: "Intern"
            summary: "{{fields.name}}"
            required: false
            hint: "Click 'Add Intern' for each person. Only add a photo if they have agreed to it."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }
          - { label: "Mentors Label", name: "mentorsKicker", widget: "string", required: false }
          - { label: "Mentors Heading", name: "mentorsHeading", widget: "string", required: false }
          - { label: "Mentors Intro", name: "mentorsIntro", widget: "text", required: false }
          - label: "Mentors"
            name: "mentors"
            widget: "list"
            label_singular: "Mentor"
            summary: "{{fields.name}}"
            required: false
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Short Bio", name: "bio", widget: "text", required: false }
              - { label: "Photo", name: "photo", widget: "image", required: false }

      - name: "get-involved"
        label: "Get Involved Page"
        file: "src/get-involved.njk"
        format: "frontmatter"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "How It Works Label", name: "howKicker", widget: "string", required: false }
          - { label: "How It Works Heading", name: "howHeading", widget: "string", required: false }
          - { label: "How It Works Paragraph", name: "howBody", widget: "text" }
          - { label: "Roles Label", name: "rolesKicker", widget: "string", required: false }
          - { label: "Roles Heading", name: "rolesHeading", widget: "string", required: false }
          - label: "Intern Roles"
            name: "roles"
            widget: "list"
            label_singular: "Role"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - { label: "How To Apply Label", name: "applyKicker", widget: "string", required: false }
          - { label: "How To Apply Heading", name: "applyHeading", widget: "string", required: false }
          - { label: "How To Apply Paragraph", name: "applyBody", widget: "text" }

      - name: "published-work"
        label: "Published Work List"
        file: "src/_data/publishedWork.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            label_singular: "Entry"
            summary: "{{fields.name}}"
            fields:
              - label: "Status"
                name: "tag"
                widget: "select"
                options: ["live", "progress"]
              - { label: "Status Label", name: "tagLabel", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Link URL", name: "link", widget: "string", required: false }
              - { label: "Link Text", name: "linkText", widget: "string", required: false }

      - name: "contact"
        label: "Contact Info"
        file: "src/_data/contact.json"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "list"
            label_singular: "Link"
            summary: "{{fields.name}}"
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "URL", name: "link", widget: "string" }

  - name: "research"
    label: "Research Articles"
    label_singular: "Article"
    folder: "src/research"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "displayDate", widget: "string", hint: "e.g. January 2027" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "article.njk" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "research" }
      - label: "URL Path"
        name: "permalink"
        widget: "string"
        hint: "e.g. /research/my-article-slug/"
