backend:
  name: git-gateway
  branch: main

# After the first deploy, files saved through this CMS commit straight to
# your GitHub repo, and Netlify rebuilds the site automatically.
media_folder: "src/assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Home Page"
        file: "src/index.njk"
        fields:
          - { label: "Hero Eyebrow", name: "heroEyebrow", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "Pull Quote", name: "quote", widget: "text" }
          - label: "Three Pillars"
            name: "pillars"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Link", name: "link", widget: "string" }
              - { label: "Link Text", name: "linkText", widget: "string" }

      - name: "about"
        label: "About Page"
        file: "src/about.njk"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "Mission Heading", name: "missionHeading", widget: "string" }
          - { label: "Mission Paragraph 1", name: "missionBody", widget: "text" }
          - { label: "Mission Paragraph 2", name: "missionBody2", widget: "text" }
          - label: "Founders"
            name: "founders"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }

      - name: "get-involved"
        label: "Get Involved Page"
        file: "src/get-involved.njk"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "How It Works Paragraph", name: "howBody", widget: "text" }
          - label: "Intern Roles"
            name: "roles"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Body", name: "body", widget: "text" }
          - { label: "How To Apply Paragraph", name: "applyBody", widget: "text" }

      - name: "whats-next"
        label: "What's Next Page"
        file: "src/whats-next.njk"
        fields:
          - { label: "Hero Title", name: "heroTitle", widget: "string" }
          - { label: "Hero Subtext", name: "heroLede", widget: "text" }
          - { label: "Status Tag Label", name: "tagLabel", widget: "string" }
          - { label: "Initiative Name", name: "heading", widget: "string" }
          - { label: "Description", name: "body", widget: "text" }
          - { label: "Follow-up Note", name: "body2", widget: "text" }

      - name: "published-work"
        label: "Published Work List"
        file: "src/_data/publishedWork.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            fields:
              - label: "Status"
                name: "tag"
                widget: "select"
                options: ["live", "progress"]
              - { label: "Status Label", name: "tagLabel", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "body", widget: "text" }
              - { label: "Link URL", name: "link", widget: "string" }
              - { label: "Link Text", name: "linkText", widget: "string" }

      - name: "contact"
        label: "Contact Info"
        file: "src/_data/contact.json"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - label: "Social Links"
            name: "social"
            widget: "list"
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "URL", name: "link", widget: "string" }

  - name: "research"
    label: "Research Articles"
    folder: "src/research"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "displayDate", widget: "string", hint: "e.g. January 2027" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Layout", name: "layout", widget: "hidden", default: "article.njk" }
      - { label: "Tags", name: "tags", widget: "hidden", default: "research" }
      - label: "URL Path"
        name: "permalink"
        widget: "string"
        hint: "e.g. /research/my-article-slug/"
